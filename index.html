<html lang="zh-Hant">
<head>

  <meta name="theme-color" content="#f7f7f4"><title>日序｜個人行程與任務</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    :root{--bg:#fffaf0;--paper:#fff;--ink:#28223a;--muted:#827b8e;--line:#eee8dc;--green:#6738e8;--green-soft:#eee7ff;--orange:#ff673d;--blue:#00a9c7;--pink:#f32983;--yellow:#ffd21f;--shadow:0 12px 40px #42207918}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans','Noto Sans TC',sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1320px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}
    aside{padding:32px 18px 24px 28px;border-right:1px solid #ece4d6;display:flex;flex-direction:column;gap:34px;background:linear-gradient(180deg,#fff1c2 0%,#ffe2d5 48%,#e5faff 100%)}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:.02em}.brandmark{width:34px;height:34px;border-radius:12px;background:linear-gradient(140deg,#6436ef,#f32983 58%,#ff8a27);display:grid;place-items:center;color:white;font-size:19px;box-shadow:0 5px 12px #8b42df52}.nav-label{font-size:10px;letter-spacing:.14em;color:#8e7e77;margin:0 10px 9px}.nav button{width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;color:#655b70;display:flex;gap:12px;align-items:center;margin:2px 0}.nav button.active{background:linear-gradient(100deg,#ded0ff,#ffd2e4);color:#5525d8;font-weight:700}.nav .ico{font-size:17px;width:19px;text-align:center}.mini-calendar{padding:16px 12px;background:#ffffffed;border:1px solid #ffffff;border-radius:14px;box-shadow:0 8px 20px #7c4c2b12}.mini-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;margin-bottom:14px}.mini-head button{border:0;background:none;color:var(--muted);padding:2px 5px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}.weekdays{font-size:9px;color:#8d847a;margin-bottom:7px}.days button{border:0;background:none;width:25px;height:25px;border-radius:50%;font-size:10px;color:#514b5b;padding:0;margin:auto}.days button.today{background:linear-gradient(140deg,#6236ef,#ef287f 60%,#ff7a26);color:white;font-weight:700}.days button.dim{color:#c5c8c0}.sidebar-bottom{margin-top:auto;color:#716576;font-size:11px;padding:12px 8px;line-height:1.7}
    main{padding:31px 44px 55px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}.crumb{color:#8f8998;font-size:12px}.top-right{display:flex;align-items:center;gap:13px}.icon-btn{border:1px solid var(--line);background:white;width:36px;height:36px;border-radius:11px;color:#697068;position:relative}.bell-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#ff573c;right:7px;top:7px}.avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,#ffd21f,#ff9e2c 48%,#ff5285);color:white;display:grid;place-items:center;font-weight:700;font-size:12px}.greeting{color:#6236ef;font-size:11px;letter-spacing:.12em;font-weight:700;margin-bottom:9px}.heading-row{display:flex;justify-content:space-between;align-items:end;margin-bottom:27px}.heading-row h1{font-size:32px;letter-spacing:-.04em;margin:0 0 6px;font-weight:700}.sub{color:#81798c;font-size:12px}.primary{background:linear-gradient(110deg,#6338ef,#b52de1 52%,#f32983);color:white;border:0;border-radius:10px;padding:11px 16px;box-shadow:0 6px 16px #7a3be64a;font-weight:700}.primary:hover{filter:saturate(1.15) brightness(.96)}.plus{font-size:17px;margin-right:7px;vertical-align:-1px}.date-strip{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.date-switch{display:flex;align-items:center;gap:12px}.date-switch button{border:1px solid var(--line);background:white;color:#62586f;width:30px;height:30px;border-radius:9px}.date-full{font-weight:600;font-size:14px}.today-link{border:0;background:none;color:#6236ef;font-size:11px;font-weight:700}.view-switch{border:1px solid var(--line);border-radius:9px;padding:3px;background:#fff;display:flex}.view-switch button{border:0;background:none;color:#898393;padding:6px 12px;border-radius:7px;font-size:11px}.view-switch button.selected{background:#e9e0ff;color:#592edc;font-weight:700}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:23px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 7px 18px #654d8910}.summary-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#e7dcff;color:#5c2ae6;font-size:16px}.summary-card:nth-child(2) .summary-icon{background:#ffe2d5;color:#ed4d24}.summary-card:nth-child(3) .summary-icon{background:#d8f8fb;color:#008ca5}.summary-number{font-size:18px;font-weight:700;line-height:1.15}.summary-label{color:#898393;font-size:10px;margin-top:4px}
    .content-grid{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.schedule{padding:19px 19px 12px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-title{font-weight:600;font-size:13px}.panel-hint{color:#8e8798;font-size:10px}.timeline{position:relative}.slot{display:grid;grid-template-columns:50px 1fr;min-height:57px}.slot-time{font-size:10px;color:#91899b;padding-top:5px}.slot-lane{border-top:1px solid #f1ece3;position:relative;padding:5px 0 7px}.slot:first-child .slot-lane{border-top:1px solid #f1ece3}.event{min-height:44px;border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:9px;position:relative;overflow:hidden}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--event-color)}.event.green{--event-color:#6236ef;background:#e9e0ff}.event.orange{--event-color:#ff5635;background:#ffe0d2}.event.blue{--event-color:#009dbb;background:#d5f7fa}.event.purple{--event-color:#ed2380;background:#ffdcec}.event-check{border:1.5px solid var(--event-color);background:#ffffff70;border-radius:50%;width:16px;height:16px;flex:0 0 16px;padding:0;color:white;font-size:10px}.event.done .event-check{background:var(--event-color);border-color:var(--event-color)}.event.done .event-name{text-decoration:line-through;color:#8a8492}.event-copy{min-width:0;flex:1}.event-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-meta{font-size:9px;color:#686071;margin-top:3px}.event-time{font-size:9px;color:#51495e;white-space:nowrap;font-weight:600}.event-actions{display:flex;gap:2px;opacity:.75;transition:opacity .15s}.event:hover .event-actions,.event:focus-within .event-actions{opacity:1}.item-action{border:0;background:#ffffffd9;color:#55446e;border-radius:6px;padding:4px 5px;font-size:10px;line-height:1}.empty-slot{height:3px}.right-col{display:flex;flex-direction:column;gap:15px}.tasks-panel{padding:17px 16px}.task-list{display:flex;flex-direction:column;gap:2px}.task{display:flex;align-items:flex-start;gap:9px;padding:10px 1px;border-bottom:1px solid #f1ece3}.task:last-child{border-bottom:0}.task-check{width:15px;height:15px;border:1.4px solid #9c91ad;border-radius:5px;background:#fff;padding:0;margin-top:1px;flex:0 0 15px;color:white;font-size:10px}.task.done .task-check{background:#6236ef;border-color:#6236ef}.task.done .task-name{text-decoration:line-through;color:#96909e}.task-name{font-size:10px;line-height:1.5;font-weight:600}.task-meta{font-size:9px;color:#91899b;margin-top:4px}.task-meta .due{color:var(--orange)}.task-more{margin-left:auto;border:0;background:none;color:#a4a89f;font-size:15px;padding:0 3px}.item-menu{position:relative;margin-left:auto}.item-menu summary{list-style:none;cursor:pointer;color:#6e647d;font-size:16px;line-height:1;padding:1px 4px}.item-menu summary::-webkit-details-marker{display:none}.menu-options{position:absolute;z-index:3;right:0;top:22px;background:white;border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 8px 20px #42325724;min-width:94px}.menu-options button{display:block;width:100%;border:0;background:white;text-align:left;padding:7px 8px;border-radius:6px;font-size:10px;color:#655e70}.menu-options button:hover{background:#efe8ff}.menu-options button.delete{color:#e52c50}.empty-tasks{text-align:center;padding:20px 5px;color:#8b8495;font-size:11px}.week-panel{padding:17px 16px}.week-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1ece3}.week-row:last-child{border:0}.week-date{font-size:9px;color:#898194;width:25px}.week-bar{height:6px;background:#f0edf4;border-radius:5px;flex:1;overflow:hidden}.week-bar i{display:block;background:linear-gradient(90deg,#6336ef,#f32983 54%,#ff8a22);height:100%;border-radius:5px}.week-count{font-size:9px;color:#777082;width:24px;text-align:right}
    .overlay{position:fixed;inset:0;background:#222a2460;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.open{display:flex}.modal{width:min(475px,100%);background:white;border-radius:18px;padding:24px;box-shadow:0 24px 80px #17201735}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f4f5f1;border-radius:8px;width:30px;height:30px;color:#73796f;font-size:18px}.type-tabs{display:flex;background:#f4f5f1;border-radius:9px;padding:3px;margin-bottom:17px}.type-tabs button{flex:1;border:0;background:none;padding:8px;border-radius:7px;color:#888e83;font-size:11px}.type-tabs button.active{background:white;color:var(--green);font-weight:600;box-shadow:0 1px 4px #0000000c}.field{margin-bottom:13px}.field label{display:block;font-size:10px;color:#7e847a;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #e6e9e2;border-radius:9px;padding:10px 11px;outline:none;color:var(--ink);background:white;font-size:12px}.field input:focus,.field select:focus{border-color:#95ad98;box-shadow:0 0 0 3px #edf3ed}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form-options{display:flex;gap:16px;flex-wrap:wrap;margin:5px 0 17px}.check-option{display:flex;align-items:center;gap:6px;color:#72786e;font-size:10px}.check-option input{accent-color:var(--green)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:16px}.secondary{background:white;border:1px solid var(--line);color:#72786e;border-radius:9px;padding:9px 14px;font-size:11px}.modal-actions .primary{padding:9px 16px;font-size:11px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:#28352b;color:white;border-radius:9px;padding:10px 16px;font-size:11px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:980px){.app{grid-template-columns:190px 1fr}aside{padding-left:17px;padding-right:12px}main{padding:26px 24px}.content-grid{grid-template-columns:minmax(0,1fr) 245px;gap:12px}}

    @media(max-width:460px){.right-col{grid-template-columns:1fr}.view-switch button{padding:6px 8px}.summary-card{display:block}.summary-icon{margin-bottom:8px}.heading-row .primary{padding:10px 11px;font-size:11px}.date-full{font-size:12px}}
    .weather-card{display:flex;align-items:center;gap:13px;background:#d8f8fb;border:1px solid #a7eaf0;border-radius:13px;padding:12px 15px;margin:-8px 0 20px;color:#194b58}.weather-symbol{font-size:27px;line-height:1;width:38px;text-align:center}.weather-info{min-width:0;flex:1}.weather-title{font-size:11px;font-weight:700}.weather-description{font-size:10px;color:#39717c;margin-top:3px}.weather-temp{font-size:19px;font-weight:700;color:#087e99;white-space:nowrap}.weather-temp small{font-size:10px;font-weight:500;color:#39717c}.weather-button{border:0;background:#00a9c7;color:white;border-radius:8px;padding:8px 11px;font-size:10px;font-weight:700;white-space:nowrap}.weather-button:hover{background:#008da8}
    @media(max-width:460px){.weather-card{gap:8px;padding:10px}.weather-symbol{width:30px;font-size:23px}.weather-temp{font-size:16px}.weather-button{padding:7px 8px}}
    /* High-energy solid-color theme: intentionally no gradients. */
    aside{background:#fff0c2!important}.brandmark{background:#6738e8!important}.nav button.active{background:#ffd2e4!important}.days button.today{background:#6738e8!important}.avatar{background:#ffd21f!important}.primary{background:#6738e8!important}.primary:hover{background:#5325cf!important;filter:none!important}.week-bar i{background:#f32983!important}
    /* Keep weekday labels and day cells on the same seven-column grid. */
    .weekdays,.days{grid-template-columns:repeat(7,minmax(0,1fr));gap:0;width:100%}.weekdays span{min-width:0;text-align:center}.days button{width:100%;height:24px;max-width:24px;margin:0 auto;justify-self:center;display:grid;place-items:center;padding:0;line-height:1}
    .date-switch .today-link{width:auto;height:30px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;flex:none;white-space:nowrap;line-height:1}
    .star-mark{color:#f0ad00;font-size:12px;line-height:1;margin-left:5px;vertical-align:1px;text-shadow:0 1px 0 #ffdf70}
    .hero-doodle{width:76px;height:76px;flex:none;margin:0 12px 0 auto;transform:rotate(-5deg)}.doodle-sun{filter:drop-shadow(0 4px 0 #ffd21f55);animation:bob 3s ease-in-out infinite}.mini-doodle{width:19px;height:19px;vertical-align:middle;margin-left:5px}.empty-art{display:block;width:50px;height:50px;margin:0 auto 9px}.empty-tasks{line-height:1.7}.doodle-spark{transform-origin:center;animation:twinkle 2s ease-in-out infinite alternate}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes twinkle{to{opacity:.5;transform:scale(.82) rotate(14deg)}}
    @media(max-width:560px){.hero-doodle{width:52px;height:52px;margin-right:4px}.hero-doodle svg{width:52px;height:52px}}
    .doodle-wallpaper{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.app{position:relative;z-index:1}.app aside{background:rgba(255,240,194,.78)!important}.panel,.summary-card{background:rgba(255,255,255,.86)}.mini-calendar{background:rgba(255,255,255,.9)}
  </style>

<div class="app">
  <aside>
    <div class="brand"><div class="brandmark">日</div>日序 <span style="font-size:10px;color:#a1a69d;font-weight:400">DAYFLOW</span></div>
    <div class="nav"><div class="nav-label">工作空間</div><button class="active"><span class="ico">◷</span>今天</button><button id="weekNav"><span class="ico">▦</span>週視圖</button><button id="allNav"><span class="ico">✓</span>所有任務</button></div>
    <div class="mini-calendar"><div class="mini-head"><span id="miniMonth"></span><span><button id="miniPrev">‹</button><button id="miniNext">›</button></span></div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="days" id="miniDays"></div></div>
    <div class="sidebar-bottom">把每一天，安排得剛剛好。<br>你的時間，由你決定。</div>
  </aside>
  <main>
    <div class="topbar"><div class="crumb">個人工作空間　/　今天</div><div class="top-right"><button class="icon-btn" title="提醒">♧<i class="bell-dot"></i></button><div class="avatar">林</div></div></div>
    <div class="greeting" id="greeting">MONDAY, OCTOBER 30</div>
    <div class="heading-row"><div><h1>今天，慢慢來。</h1><div class="sub" id="dailyJoke"></div></div><div class="hero-doodle" aria-hidden="true"><svg class="doodle-sun" width="76" height="76" viewBox="0 0 76 76" fill="none"><path d="M38 4v8m0 52v8M4 38h8m52 0h8M14 14l6 6m36 36 6 6m0-48-6 6M20 56l-6 6" stroke="#FF7A24" stroke-width="4" stroke-linecap="round"/><circle cx="38" cy="38" r="23" fill="#FFD21F" stroke="#EF6A32" stroke-width="3"/><circle cx="30" cy="35" r="2.5" fill="#34244C"/><circle cx="46" cy="35" r="2.5" fill="#34244C"/><path d="M31 44c4 5 10 5 14 0" stroke="#34244C" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="42" r="3" fill="#FF739A"/><circle cx="52" cy="42" r="3" fill="#FF739A"/><path class="doodle-spark" d="m62 13 2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="#6738E8"/></svg></div><button class="primary" id="addBtn"><span class="plus">＋</span>新增項目</button></div>
    <div class="weather-card"><div class="weather-symbol" id="weatherIcon">🌤️</div><div class="weather-info"><div class="weather-title" id="weatherTitle">今日天氣</div><div class="weather-description" id="weatherDescription">點一下，看看你所在地的天氣</div></div><div class="weather-temp" id="weatherTemp"></div><button class="weather-button" id="weatherButton">取得天氣</button></div>
    <div class="date-strip"><div class="date-switch"><button id="prevDay">‹</button><span class="date-full" id="fullDate"></span><button id="nextDay">›</button><button class="today-link" id="todayBtn">回到今天</button></div><div class="view-switch"><button class="selected" data-view="day">日</button><button data-view="week">週</button><button data-view="month">月</button></div></div>
    <div class="summary"><div class="summary-card"><div class="summary-icon">◷</div><div><div class="summary-number" id="summaryEvents">0</div><div class="summary-label">今日行程</div></div></div><div class="summary-card"><div class="summary-icon">✓</div><div><div class="summary-number" id="summaryTasks">0</div><div class="summary-label">待完成任務</div></div></div><div class="summary-card"><div class="summary-icon">⌁</div><div><div class="summary-number" id="summaryDone">0%</div><div class="summary-label">今日完成率</div></div></div></div>
    <div class="content-grid"><section class="panel schedule"><div class="panel-head"><div class="panel-title">今日時間軸</div><span class="panel-hint">點選圓圈即可完成</span></div><div class="timeline" id="timeline"></div></section><div class="right-col"><section class="panel tasks-panel"><div class="panel-head"><div class="panel-title">未排時間 <svg class="mini-doodle doodle-spark" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 1 15 8l8 4-8 3-3 8-3-8-8-3 8-4 3-7Z" fill="#FF7043"/></svg></div><button class="task-more" id="quickTask" title="新增任務">＋</button></div><div class="task-list" id="taskList"></div></section><section class="panel week-panel"><div class="panel-head"><div class="panel-title">本週概覽 <svg class="mini-doodle" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2c2.6 0 3.7 2.5 4 4.2 2.3-1.2 5.1-.1 5.2 2.8.1 2.5-2.3 4.1-4.6 4.3 1 2.3-.3 5.4-3 5.4-2.6 0-3.8-2.7-3.7-4.5-2.5 1.1-5.4-.3-5.2-3 .1-2.7 2.7-3.8 4.7-3.7C8.3 5 9.4 2 12 2Z" fill="#F32983"/><circle cx="12" cy="11" r="2.2" fill="#FFD21F"/><path d="M12 18v5m0-2c-2-2-3.2-2-4.5-2" stroke="#328D55" stroke-width="1.6" stroke-linecap="round"/></svg></div><span class="panel-hint" id="weekRange"></span></div><div id="weekOverview"></div></section></div></div>
  </main>
</div>
<div class="overlay" id="overlay"><form class="modal" id="itemForm"><div class="modal-head"><h2>新增安排</h2><button type="button" class="close" id="closeModal">×</button></div><div class="type-tabs"><button type="button" class="active" data-type="event">行程</button><button type="button" data-type="task">任務</button></div><input type="hidden" id="type" value="event"><div class="field"><label for="title">名稱</label><input id="title" required maxlength="70" placeholder="例如：專案週會"></div><div class="field-grid"><div class="field"><label for="date">日期</label><input type="date" id="date" required></div><div class="field" id="colorWrap"><label for="color">標籤顏色</label><select id="color"><option value="green">亮紫</option><option value="orange">珊瑚橘</option><option value="blue">青藍</option><option value="purple">桃紅</option></select></div></div><div class="field-grid" id="timeFields"><div class="field"><label for="start">開始時間</label><input type="time" id="start" value="09:00"></div><div class="field"><label for="end">結束時間</label><input type="time" id="end" value="10:00"></div></div><div class="field"><label for="repeat">重複</label><select id="repeat"><option value="none">不重複</option><option value="daily">每天</option><option value="weekdays">每個平日</option><option value="weekly">每週</option></select></div><div class="form-options"><label class="check-option"><input type="checkbox" id="remind" checked> 開始時提醒</label><label class="check-option"><input type="checkbox" id="allDay"> 全天</label><label class="check-option important-option"><input type="checkbox" id="important"> <span class="star-mark">★</span> 重要事項</label></div><div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">取消</button><button class="primary" type="submit">儲存安排</button></div></form></div><div class="toast" id="toast"></div>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const today=new Date();today.setHours(0,0,0,0);let selected=new Date(today),miniDate=new Date(today),editingId=null,lastWeather=null;
  const key='dayflow-items-v1';let items=JSON.parse(localStorage.getItem(key)||'null');
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(!items){const d=iso(today);items=[{id:crypto.randomUUID(),title:'晨間整理與今日計畫',date:d,start:'08:30',end:'09:00',type:'event',color:'green',done:true,repeat:'none',remind:false},{id:crypto.randomUUID(),title:'產品設計討論',date:d,start:'10:00',end:'11:00',type:'event',color:'blue',done:false,repeat:'none',remind:true},{id:crypto.randomUUID(),title:'午餐與散步',date:d,start:'12:00',end:'13:00',type:'event',color:'orange',done:false,repeat:'none',remind:false},{id:crypto.randomUUID(),title:'完成首頁線框稿',date:d,start:'14:00',end:'15:30',type:'event',color:'purple',done:false,repeat:'none',remind:true,important:true},{id:crypto.randomUUID(),title:'回覆設計合作夥伴',date:d,type:'task',done:false,repeat:'none',remind:false},{id:crypto.randomUUID(),title:'整理本週閱讀筆記',date:d,type:'task',done:false,repeat:'none',remind:false},{id:crypto.randomUUID(),title:'確認週五簡報資料',date:d,type:'task',done:true,repeat:'none',remind:false}];save()}
  function save(){localStorage.setItem(key,JSON.stringify(items))}
  function fmt(d,opt={weekday:'long',year:'numeric',month:'long',day:'numeric'}){return new Intl.DateTimeFormat('zh-TW',opt).format(d)}
  const jokes=['為什麼電腦很會游泳？因為它有很多「視窗」。','為什麼行事曆很受歡迎？因為它每天都有約。','為什麼鉛筆很謙虛？因為它總說自己還有進步空間。','為什麼咖啡不怕冷？因為它很有「熱」情。','為什麼鬧鐘很守信用？因為它說響就響。','為什麼書包很會保密？因為它什麼都往心裡（包）放。','為什麼月亮不愛加班？因為它晚上已經很忙了。','為什麼橡皮擦很樂觀？因為錯誤都可以再擦掉。','為什麼日曆最會交朋友？因為它每天都認識新的一天。','為什麼桌子不會迷路？因為它有四個方向（腳）。'];
  function updateJoke(d){const stamp=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000;$('#dailyJoke').textContent='今日笑話｜'+jokes[((stamp%jokes.length)+jokes.length)%jokes.length];if(lastWeather)renderWeather()}
  function markImportant(){document.querySelectorAll('.event-name,.task-name').forEach(el=>{const title=el.textContent.trim(),isEvent=!!el.closest('.event'),found=items.some(i=>i.important&&i.title===title&&i.type===(isEvent?'event':'task')&&isScheduled(i,iso(selected)));if(found&&!el.querySelector('.star-mark')){const star=document.createElement('span');star.className='star-mark';star.textContent='★';star.setAttribute('aria-label','重要事項');el.appendChild(star)}})}
  function weatherText(code){if(code===0)return['晴朗','☀️'];if([1,2].includes(code))return['晴時多雲','🌤️'];if(code===3)return['多雲','☁️'];if([45,48].includes(code))return['有霧','🌫️'];if([51,53,55,56,57].includes(code))return['毛毛雨','🌦️'];if([61,63,65,66,67,80,81,82].includes(code))return['有雨','🌧️'];if([71,73,75,77,85,86].includes(code))return['降雪','❄️'];if([95,96,99].includes(code))return['雷雨','⛈️'];return['天氣變化中','🌤️']}
  async function loadWeather(){const btn=$('#weatherButton');if(!navigator.geolocation){$('#weatherDescription').textContent='這個瀏覽器不支援位置服務';return}btn.disabled=true;btn.textContent='定位中…';$('#weatherDescription').textContent='請允許瀏覽器取得位置';navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude,longitude}=pos.coords;const url=new URL('https://api.open-meteo.com/v1/forecast');url.search=new URLSearchParams({latitude,longitude,current:'temperature_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',forecast_days:'7'});const res=await fetch(url);if(!res.ok)throw new Error('weather');lastWeather=await res.json();renderWeather()}catch(err){$('#weatherDescription').textContent='天氣資料暫時無法載入，請稍後再試'}finally{btn.disabled=false;btn.textContent='重新整理'}},err=>{const msg=err.code===1?'尚未允許位置權限，請在瀏覽器設定中開啟':err.code===2?'目前無法取得位置，請稍後再試':'定位逾時，請再試一次';$('#weatherDescription').textContent=msg;btn.disabled=false;btn.textContent='再試一次'},{enableHighAccuracy:false,timeout:12000,maximumAge:600000})}
  function renderWeather(){if(!lastWeather)return;const date=iso(selected),idx=lastWeather.daily.time.indexOf(date),current=(date===iso(today));let code,temp='',details='所在地';if(current){code=lastWeather.current.weather_code;temp=`${Math.round(lastWeather.current.temperature_2m)}°`;if(idx>=0)details+=`　今日 ${Math.round(lastWeather.daily.temperature_2m_min[idx])}°–${Math.round(lastWeather.daily.temperature_2m_max[idx])}°　降雨 ${lastWeather.daily.precipitation_probability_max[idx]??0}%`}else if(idx>=0){code=lastWeather.daily.weather_code[idx];temp=`${Math.round(lastWeather.daily.temperature_2m_min[idx])}°–${Math.round(lastWeather.daily.temperature_2m_max[idx])}°`;details+=`　降雨機率 ${lastWeather.daily.precipitation_probability_max[idx]??0}%`}else{code=lastWeather.current.weather_code;details='目前只提供未來 7 天預報'}const [label,icon]=weatherText(code);$('#weatherIcon').textContent=icon;$('#weatherTitle').textContent=`${fmt(selected,{month:'long',day:'numeric'})}・${label}`;$('#weatherTemp').innerHTML=`${temp}<small>${current?' 現在':' 高低溫'}</small>`;$('#weatherDescription').textContent=details}
  function isScheduled(it,date){if(it.date===date)return true;if(!it.repeat||it.repeat==='none'||it.date>date)return false;const start=new Date(it.date+'T00:00:00'),cur=new Date(date+'T00:00:00'),diff=Math.round((cur-start)/86400000);if(it.repeat==='daily')return true;if(it.repeat==='weekdays')return cur.getDay()>0&&cur.getDay()<6;if(it.repeat==='weekly')return cur.getDay()===start.getDay()&&diff>=7;return false}
  function getFor(d){return items.filter(i=>isScheduled(i,iso(d)))}
  new MutationObserver(markImportant).observe($('#timeline'),{childList:true,subtree:true});new MutationObserver(markImportant).observe($('#taskList'),{childList:true,subtree:true});
  function render(){const date=iso(selected),list=getFor(selected),events=list.filter(i=>i.type==='event').sort((a,b)=>(a.start||'').localeCompare(b.start||'')),tasks=list.filter(i=>i.type==='task');$('#fullDate').textContent=fmt(selected);$('#greeting').textContent=fmt(selected,{weekday:'long',month:'long',day:'numeric'}).toLocaleUpperCase('en-US');updateJoke(selected);$('#summaryEvents').textContent=events.length;$('#summaryTasks').textContent=tasks.filter(x=>!x.done).length;let total=list.length,done=list.filter(x=>x.done).length;$('#summaryDone').textContent=(total?Math.round(done/total*100):0)+'%';
    const timeline=$('#timeline');timeline.innerHTML='';for(let h=8;h<=19;h++){const s=document.createElement('div');s.className='slot';const time=`${String(h).padStart(2,'0')}:00`;s.innerHTML=`<div class="slot-time">${time}</div><div class="slot-lane"></div>`;const lane=s.querySelector('.slot-lane'),inHour=events.filter(e=>e.start&&Number(e.start.slice(0,2))===h);if(inHour.length){for(const e of inHour){const node=document.createElement('div');node.className=`event ${e.color||'green'} ${e.done?'done':''}`;node.innerHTML=`<button class="event-check" aria-label="完成">${e.done?'✓':''}</button><div class="event-copy"><div class="event-name"></div><div class="event-meta">${e.remind?'◦ 提醒開啟':''}${e.repeat&&e.repeat!=='none'?'　↻ '+repeatLabel(e.repeat):''}</div></div><div class="event-time">${e.start||''} – ${e.end||''}</div><div class="event-actions"><button class="item-action edit-item" title="編輯" aria-label="編輯">✎</button><button class="item-action delete-item" title="刪除" aria-label="刪除">×</button></div>`;node.querySelector('.event-name').textContent=e.title;node.querySelector('.event-check').onclick=()=>toggle(e.id);node.querySelector('.edit-item').onclick=()=>openModal('event',e.id);node.querySelector('.delete-item').onclick=()=>removeItem(e.id);lane.appendChild(node)}}else lane.innerHTML='<div class="empty-slot"></div>';timeline.appendChild(s)}
    const taskList=$('#taskList');taskList.innerHTML='';if(!tasks.length)taskList.innerHTML='<div class="empty-tasks">目前沒有未排時間的任務<br>享受片刻空檔吧 🌿</div>';for(const t of tasks){const row=document.createElement('div');row.className=`task ${t.done?'done':''}`;row.innerHTML=`<button class="task-check" aria-label="完成">${t.done?'✓':''}</button><div style="min-width:0"><div class="task-name"></div><div class="task-meta">${t.repeat&&t.repeat!=='none'?'↻ '+repeatLabel(t.repeat):'今日'}${t.remind?'　·　開始時提醒':''}</div></div><details class="item-menu"><summary aria-label="任務操作">⋯</summary><div class="menu-options"><button class="edit-item">編輯</button><button class="delete-item delete">刪除</button></div></details>`;row.querySelector('.task-name').textContent=t.title;row.querySelector('.task-check').onclick=()=>toggle(t.id);row.querySelector('.edit-item').onclick=()=>openModal('task',t.id);row.querySelector('.delete-item').onclick=()=>removeItem(t.id);taskList.appendChild(row)}renderWeek();renderMini()}
  function repeatLabel(v){return {daily:'每天',weekdays:'平日',weekly:'每週'}[v]||''}
  function toggle(id){const it=items.find(x=>x.id===id);if(it){it.done=!it.done;save();render()}}
  function renderMini(){const y=miniDate.getFullYear(),m=miniDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;$('#miniMonth').textContent=`${y} 年 ${m+1} 月`;const el=$('#miniDays');el.innerHTML='';for(let i=0;i<offset;i++){const b=document.createElement('button');b.className='dim';b.textContent=new Date(y,m,0).getDate()-offset+i+1;el.appendChild(b)}for(let n=1;n<=days;n++){const b=document.createElement('button');b.textContent=n;const d=new Date(y,m,n);if(iso(d)===iso(today))b.classList.add('today');if(iso(d)===iso(selected))b.style.outline='1px solid #7f9b82';b.onclick=()=>{selected=d;render()};el.appendChild(b)}}
  function renderWeek(){const start=new Date(selected);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(start.getDate()+6);$('#weekRange').textContent=`${start.getMonth()+1}/${start.getDate()} – ${end.getMonth()+1}/${end.getDate()}`;const root=$('#weekOverview');root.innerHTML='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const l=getFor(d),n=l.length,finished=l.filter(x=>x.done).length,p=n?Math.round(finished/n*100):0,row=document.createElement('div');row.className='week-row';row.innerHTML=`<span class="week-date">${['一','二','三','四','五','六','日'][i]} ${d.getDate()}</span><div class="week-bar"><i style="width:${p}%"></i></div><span class="week-count">${n} 項</span>`;row.onclick=()=>{selected=d;render()};row.style.cursor='pointer';root.appendChild(row)}}
  function openModal(type='event',id=null){const f=$('#itemForm');f.reset();editingId=id;const item=id?items.find(x=>x.id===id):null;type=item?.type||type;$('#type').value=type;$$('.type-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===type));$('#date').value=item?.date||iso(selected);$('#title').value=item?.title||'';$('#start').value=item?.start||'09:00';$('#end').value=item?.end||'10:00';$('#color').value=item?.color||'green';$('#repeat').value=item?.repeat||'none';$('#remind').checked=item?!!item.remind:true;$('#important').checked=!!item?.important;$('#allDay').checked=!!item&&type==='event'&&!item.start;$('#timeFields').style.display=type==='task'?'none':'grid';$('#timeFields').style.opacity=$('#allDay').checked?'.4':'1';$('#start').disabled=$('#end').disabled=$('#allDay').checked;$('#colorWrap').style.display=type==='task'?'none':'block';$('.modal-head h2').textContent=item?'編輯安排':'新增安排';$('.modal-actions .primary').textContent=item?'儲存變更':'儲存安排';$('#overlay').classList.add('open');setTimeout(()=>$('#title').focus(),30)}
  function removeItem(id){const item=items.find(x=>x.id===id);if(!item)return;if(confirm(`確定刪除「${item.title}」嗎？`)){items=items.filter(x=>x.id!==id);save();render();toast('已刪除安排')}}
  $('#addBtn').onclick=()=>openModal();$('#quickTask').onclick=()=>openModal('task');$('#closeModal').onclick=$('#cancelBtn').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('open')};$$('.type-tabs button').forEach(b=>b.onclick=()=>{const t=b.dataset.type;$('#type').value=t;$$('.type-tabs button').forEach(x=>x.classList.toggle('active',x===b));$('#timeFields').style.display=t==='task'?'none':'grid';$('#colorWrap').style.display=t==='task'?'none':'block'});
  $('#allDay').onchange=e=>{$('#timeFields').style.opacity=e.target.checked?'.4':'1';$('#start').disabled=e.target.checked;$('#end').disabled=e.target.checked};$('#itemForm').onsubmit=e=>{e.preventDefault();const type=$('#type').value,start=$('#start').value,end=$('#end').value;if(type==='event'&&!$('#allDay').checked&&start&&end&&end<=start){toast('結束時間需晚於開始時間');return}const existing=editingId?items.find(x=>x.id===editingId):null;const item={...(existing||{}),id:existing?.id||crypto.randomUUID(),title:$('#title').value.trim(),type,date:$('#date').value,start:type==='event'&&!$('#allDay').checked?start:'',end:type==='event'&&!$('#allDay').checked?end:'',color:$('#color').value,repeat:$('#repeat').value,remind:$('#remind').checked,done:existing?.done||false};if(existing)Object.assign(existing,item);else items.push(item);save();selected=new Date(item.date+'T00:00:00');$('#overlay').classList.remove('open');render();editingId=null;toast(existing?'已儲存變更':item.remind?'已新增，開始時提醒已開啟':'已新增安排')};
  $('#itemForm').addEventListener('submit',()=>{const id=editingId,values={title:$('#title').value.trim(),date:$('#date').value,type:$('#type').value,important:$('#important').checked};setTimeout(()=>{const target=id?items.find(x=>x.id===id):[...items].reverse().find(x=>x.title===values.title&&x.date===values.date&&x.type===values.type);if(target){target.important=values.important;save();render()}},0)},true);
  $('#weatherButton').onclick=loadWeather;
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
  $('#prevDay').onclick=()=>{selected.setDate(selected.getDate()-1);render()};$('#nextDay').onclick=()=>{selected.setDate(selected.getDate()+1);render()};$('#todayBtn').onclick=()=>{selected=new Date(today);render()};$('#miniPrev').onclick=()=>{miniDate.setMonth(miniDate.getMonth()-1);renderMini()};$('#miniNext').onclick=()=>{miniDate.setMonth(miniDate.getMonth()+1);renderMini()};$$('.view-switch button').forEach(b=>b.onclick=()=>{ $$('.view-switch button').forEach(x=>x.classList.toggle('selected',x===b));toast(b.dataset.view==='day'?'目前顯示每日時間軸':b.dataset.view==='week'?'本週概覽已列於右側':'使用左側月曆切換日期')});$('#weekNav').onclick=()=>{document.querySelector('.week-panel').scrollIntoView({behavior:'smooth',block:'center'});toast('本週概覽已列於右側')};$('#allNav').onclick=()=>{document.querySelector('.tasks-panel').scrollIntoView({behavior:'smooth',block:'center'});toast('未排時間的任務已列於右側')};render();loadWeather();
})();
</script>
